name: Sovereign Security Protocol CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify-protocol-and-engine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Master Executable Test Battery
        run: python run_tests.py

      - name: Run Cryptographic Provenance & Repository Doctor
        run: python ssp.py --doctor

      - name: Run 7-Layer Self-Scan (Dogfooding SSP)
        run: python ssp.py scan --target . --lang en

      - name: Verify SSP-12 Release Assurance Gate
        run: python ssp.py gate --file templates/sample_evidence_record.json
